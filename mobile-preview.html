<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机端提示预览 | Lan</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        height: 100vh;
        place-items: center;
        background: #17191a;
        color: #f4f5f0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .preview-shell { display: grid; gap: 14px; justify-items: center; padding: 20px 16px; }
      .preview-label { margin: 0; color: rgba(244, 245, 240, .56); font-size: 13px; }
      .phone {
        width: auto;
        height: min(844px, calc(100vh - 70px));
        max-width: calc(100vw - 32px);
        aspect-ratio: 390 / 844;
        overflow: hidden;
        border: 8px solid #050606;
        border-radius: 30px;
        background: #080a0b;
        box-shadow: 0 24px 54px rgba(0, 0, 0, .34);
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #080a0b; }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <p class="preview-label">手机端显示预览</p>
      <div class="phone"><iframe title="手机端提示预览" src="./index.html"></iframe></div>
    </main>
  </body>
</html>
